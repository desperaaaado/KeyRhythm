[build-system]
requires = ["setuptools>=75,<81", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "keyrhythm"
version = "1.0.0"
description = "Local keyboard music performance game"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = {text = "All rights reserved"}
authors = [{name = "KeyRhythm contributors"}]
dependencies = []

[project.optional-dependencies]
app = [
  "numpy>=1.26,<2.1",
  "PySide6>=6.7,<7",
  "sounddevice>=0.5,<1",
  "soundfile>=0.12,<1",
]
analysis = [
  "librosa>=0.10,<0.12",
  "mir-eval>=0.6,<1",
  "onnxruntime>=1.18,<2",
  "pretty-midi>=0.2.9,<1",
  "resampy>=0.2.2,<0.4.3",
  "scikit-learn>=1.3,<2",
  "scipy>=1.11,<2",
  "typing-extensions>=4,<5",
]
dev = [
  "setuptools>=75,<81",
  "pytest>=8,<9",
  "pytest-qt>=4.4,<5",
  "PyInstaller>=6,<7",
]

[project.scripts]
keyrhythm = "keyrhythm.cli:main"
keyrhythm-gui = "keyrhythm.app:main"
keyrhythm-worker = "keyrhythm.analysis.worker:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
